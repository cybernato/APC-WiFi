<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APC WiFi Access</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    margin:0;
    padding:20px;
}

.alert{
    font-size:clamp(28px, 7vw, 60px);
    color:#ff3333;
    font-weight:bold;
}

.message{
    font-size:clamp(18px, 4vw, 32px);
    margin-top:15px;
}

#countdown{
    font-size:clamp(80px, 25vw, 180px);
    color:#ff3333;
    font-weight:bold;
    margin-top:20px;
}

#result{
    display:none;
}

.success{
    font-size:clamp(32px, 8vw, 70px);
    color:#00ff66;
    font-weight:bold;
}

.password-box{
    background:#00aa44;
    padding:20px;
    border-radius:15px;
    display:inline-block;
    margin-top:20px;
    font-size:clamp(24px, 6vw, 50px);
    font-weight:bold;
    word-break:break-word;
}

button{
    margin-top:20px;
    padding:15px 25px;
    font-size:clamp(16px, 4vw, 28px);
    cursor:pointer;
    border:none;
    border-radius:10px;
    background:#0078d7;
    color:white;
}

button:hover{
    background:#005ea6;
}

</style>
</head>

<body>

<div class="alert">
⚠️ APC SECURITY ALERT ⚠️
</div>

<div class="message">
Suspicious activity detected.
</div>

<div class="message">
Scanning phone...
</div>

<div class="message">
Checking photos...
</div>

<div class="message">
Checking browser history...
</div>

<div class="message">
Contacting APC Cyber Security Team...
</div>

<div id="countdown">5</div>

<div id="result">

    <div class="success">
        😄 JUST KIDDING!
    </div>

    <div class="message">
        No threats detected.
    </div>

    <div class="message">
        Welcome to Australian Paramedical College
    </div>

    <div class="message">
        APC-WIFI Password
    </div>

    <div class="password-box">
        %ApcFuture1$
    </div>

    <br>

    <button onclick="copyPassword()">
        📋 Copy Password
    </button>

</div>

<script>

let count = 5;

const timer = setInterval(() => {

    count--;

    document.getElementById("countdown").innerText = count;

    if(count <= 0){

        clearInterval(timer);

        document.getElementById("countdown").style.display = "none";

        document.getElementById("result").style.display = "block";
    }

}, 1000);

function copyPassword() {

    navigator.clipboard.writeText("%ApcFuture1$");

    alert("Password copied to clipboard!");

}

</script>

</body>
</html>
