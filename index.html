<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>APC WiFi Access</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding-top:100px;
}

#countdown{
    font-size:120px;
    color:#ff3b3b;
    font-weight:bold;
}

#password{
    display:none;
}

.password{
    background:#00aa44;
    padding:20px;
    border-radius:10px;
    display:inline-block;
    font-size:32px;
    margin-top:20px;
}
</style>
</head>

<body>

<h1>⚠️ APC SECURITY ALERT ⚠️</h1>

<p>Suspicious activity detected.</p>
<p>Scanning device...</p>

<div id="countdown">5</div>

<div id="password">
    <h1>😄 Just kidding!</h1>

    <p>No threats detected.</p>

    <h2>APC-WIFI Password</h2>

    <div class="password">
        %ApcFuture1$
    </div>
</div>

<script>
let count = 5;

const timer = setInterval(() => {
    count--;
    document.getElementById('countdown').innerText = count;

    if(count <= 0){
        clearInterval(timer);
        document.getElementById('countdown').style.display='none';
        document.getElementById('password').style.display='block';
    }
},1000);
</script>

</body>
</html>
